services:
  - type: web
    name: baton-research-continuity
    runtime: node
    plan: free
    buildCommand: node server/db/migrate.js --clean && node server/db/seed.js
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: ./data/baton.db
      - key: PRIVATE_STORAGE_DIR
        value: ./storage/private_uploads
      - key: AUTO_SEED_IF_EMPTY
        value: "true"
